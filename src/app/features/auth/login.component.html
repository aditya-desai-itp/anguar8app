<div class="card login-card shadow-sm">
  <div class="card-body">
    <div class="brand mb-2"><i></i>Forge Inventory</div>
    <p class="text-muted">Sign in to manage products, stock and customer orders.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" class="form-control" formControlName="username" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" class="form-control" formControlName="password" autocomplete="current-password">
      </div>
      <div class="alert alert-danger py-2" role="alert" *ngIf="error">{{ error }}</div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="form.invalid || busy">Sign in</button>
    </form>
    <p class="text-muted small mt-3 mb-0">
      Demo logins: <code>planner</code> / <code>factory123</code> (manager), <code>viewer</code> / <code>viewer123</code> (read only).
    </p>
  </div>
</div>
