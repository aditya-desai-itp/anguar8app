<div class="page-head">
  <div>
    <h1>Products</h1>
    <p class="text-muted mb-0">Click a row to see details and adjust stock.</p>
  </div>
  <div class="form-inline">
    <input type="search" class="form-control mr-2" [formControl]="search" placeholder="Search name, SKU, category" aria-label="Search products">
    <button type="button" class="btn btn-primary" [disabled]="!auth.isManager" (click)="create()">New product</button>
  </div>
</div>

<p class="text-muted" *ngIf="loading">Loading…</p>
<app-grid *ngIf="!loading" [columns]="columns" [rows]="rows" [pageSize]="6" (rowClick)="open($event)"></app-grid>
